---
name: "Lint"

on:
  push:
  pull_request:

permissions: {}

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: "${{ matrix.name }}"
    runs-on: "ubuntu-latest"

    # One job per scope rather than one job over everything: the three have
    # different reasons to exist, so a failure names its own culprit instead of
    # being buried in a single log. `client` is the vendored library, which is
    # meant to stand on its own (see its README) and is therefore checked
    # without the integration around it; `integration` is the Home Assistant
    # side; `tests` covers both and was, until this workflow, never checked at
    # all - scripts/lint only ever walked custom_components/.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "client"
            paths: "custom_components/betaseries/betaseries"
          # The glob draws the line between the two custom_components scopes:
          # it matches the integration's own flat modules and never descends
          # into betaseries/, which the `client` scope owns.
          - name: "integration"
            paths: "custom_components/betaseries/*.py"
          - name: "tests"
            paths: "tests"

    steps:
      - name: "Check out the repository"
        uses: "actions/checkout@v4"

      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: "pip"
          cache-dependency-path: "requirements-lint.txt"

      - name: "Install the lint toolchain"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lint.txt

      # Every check runs even if an earlier one failed: one push should report
      # every problem at once, rather than making the author fix them one round
      # trip at a time. The job still fails if any of them did.
      - name: "Lint with Ruff"
        if: "!cancelled()"
        run: ruff check --output-format=github ${{ matrix.paths }}

      - name: "Format with Ruff"
        if: "!cancelled()"
        run: ruff format --check --diff ${{ matrix.paths }}

      - name: "Lint with Pylint"
        if: "!cancelled()"
        run: pylint ${{ matrix.paths }}

      - name: "Lint with Pyright"
        if: "!cancelled()"
        run: pyright ${{ matrix.paths }}

      - name: "Lint with docstring-linter"
        if: "!cancelled()"
        run: docstring-linter ${{ matrix.paths }}
